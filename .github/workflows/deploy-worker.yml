name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'cloudflare-worker/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: "cfut_WFLhpemDHQNh1Rwq8NhVAGclXiyDXanN0ItwsxWga2cd8a6a"
          accountId: "0c815b55cadba1fa86037f35533151e0"
          workingDirectory: 'cloudflare-worker'
        env:
          CLOUDFLARE_API_TOKEN: "cfut_WFLhpemDHQNh1Rwq8NhVAGclXiyDXanN0ItwsxWga2cd8a6a"
          CLOUDFLARE_ACCOUNT_ID: "0c815b55cadba1fa86037f35533151e0"
